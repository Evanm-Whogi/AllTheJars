version: "3.9"

services:
  nextjs:
    build:
      context: .
      args:
        NEXT_PUBLIC_NAME: AllTheJars 
    container_name: AllTheJars
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_NAME: AllTheJars 
      DATABASE_URL: postgres://postgres:postgres@db:5432/appdb
      INTERNAL_API_KEY: SuperSecretApiForUpdatingPleaseChange
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: AllTheJars-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
